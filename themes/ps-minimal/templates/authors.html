{% extends "base.html" %}

{% block title %}Authors &middot; {{ SITENAME }}{% endblock %}

{% block content %}
<div class="container">
  <h1 class="page-title">Authors</h1>
  <ul class="post-list" style="list-style:none;padding:0;margin:0;">
    {% for author, articles in authors %}
      <li class="post-card" style="padding:1rem 0;">
        <a href="{{ author.url|relative_url }}">{{ author }}</a>
        <span class="post-card__sep">|</span>
        <span class="post-card__meta" style="display:inline;">{{ articles|count }} article{{ '' if articles|count == 1 else 's' }}</span>
      </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
